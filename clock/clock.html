<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel="stylesheet" href="clock.css">
</head>
<body>
    <h1 id="horloge">--</h1>

    <table class="tableau">
        <tr>   
            <td class="quart"> <!--calender-->

            </td>

            <td class="quart"> <!--clock-->

            </td>

        </tr>

        <tr> <!--time-->
            <td class="quart">

            </td>
            <td class="quart">
                <td class="timeCell">  <!--hour part 1-->
                    <h1 id="heureUne"></h1>
                </td>
                <td class="timeCell"> <!--hour part 2-->
                    <h1 id="heureDeux"></h1>
                </td>
                <td class="timeCell">    <!-- : -->
                    <h1>:</h1>
                </td>
                <td class="timeCell"> <!--minutes part 1-->
                    <h1 id="minUn"></h1>
                </td>
                <td class="timeCell"> <!--minutes part 2-->
                    <h1 id="minDeux"></h1>
                </td>
                <td class="timeCell"> <!-- : -->
                    <h1>:</h1>
                </td>
                <td class="timeCell"> <!--seconds part 1--> 
                    <h1 id="secUn"></h1>
                </td>
                <td class="timeCell"> <!--seconds part 2-->
                    <h1 id="secDeux"></h1>
                </td>
            </td>
                       
        
        </tr>
    </table>

</body>
</html>

    <script src="clock.js"></script>
